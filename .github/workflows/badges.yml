# Recalcula las cifras de los badges de paquetes del perfil (descargas,
# posición entre los debuts de CRAN y chequeos de CRAN) y las guarda en la rama
# `badges`, para que la rama principal no se llene de commits. El método está
# explicado en .github/scripts/badges.R.
#
# Corre cada hora, pero cranlogs publica un día por vez: la primera consulta,
# liviana, sólo pregunta si ya está el día nuevo. El cálculo completo, que
# consulta las descargas de miles de paquetes, se hace una vez por día publicado.
# Lo mismo vale si lo dispara algo de afuera (workflow_dispatch); para forzar el
# cálculo a mano, marcar «forzar» al lanzarlo.

name: badges

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: Calcular aunque cranlogs no haya publicado un día nuevo
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: badges
          path: rama-badges

      - name: ¿Publicó cranlogs un día nuevo?
        id: chequeo
        run: |
          dia=$(curl -fsS --max-time 30 \
            https://cranlogs.r-pkg.org/downloads/total/last-day/bigbang \
            | jq -r '.[0].end' || true)
          previo=$(cat rama-badges/ultimo-dia.txt 2>/dev/null || true)
          if [ "${{ inputs.forzar }}" = "true" ]; then
            echo "Corrida forzada: se calcula igual."
            echo "nuevo=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$dia" ] || [ "$dia" = "null" ]; then
            echo "cranlogs no respondió; se prueba en la próxima hora."
            echo "nuevo=false" >> "$GITHUB_OUTPUT"
          elif [ "$dia" = "$previo" ]; then
            echo "cranlogs sigue en $dia."
            echo "nuevo=false" >> "$GITHUB_OUTPUT"
          else
            echo "Día nuevo en cranlogs: $dia (antes $previo)."
            echo "nuevo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.chequeo.outputs.nuevo == 'true'
        with:
          path: principal

      - uses: r-lib/actions/setup-r@v2
        if: steps.chequeo.outputs.nuevo == 'true'
        with:
          use-public-rspm: true

      - name: Instalar jsonlite
        if: steps.chequeo.outputs.nuevo == 'true'
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Calcular las cifras
        if: steps.chequeo.outputs.nuevo == 'true'
        run: Rscript principal/.github/scripts/badges.R rama-badges

      - name: Commitear sólo si cambiaron
        if: steps.chequeo.outputs.nuevo == 'true'
        working-directory: rama-badges
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Las cifras no cambiaron."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Actualiza las cifras de los badges"
          git push
