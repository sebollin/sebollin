# Calcula, una vez por semana, en qué porcentaje de los paquetes que debutaron
# en CRAN el mismo año está cada paquete por sus descargas del último mes, y
# guarda el resultado en assets/badges/ para el badge del perfil. El método
# está explicado en .github/scripts/posicion.R.

name: posicion

on:
  schedule:
    - cron: "41 6 * * 1" # los lunes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posicion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Calcular la posición
        run: Rscript .github/scripts/posicion.R

      - name: Commitear sólo si cambió
        run: |
          git add assets/badges
          if git diff --cached --quiet; then
            echo "La posición no cambió."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Actualiza la posición entre los debuts de CRAN"
          git push
